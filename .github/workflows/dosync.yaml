name: Do Tools Sync For Abldg

# 共享同步逻辑位于私有仓库 shared_actions/sync_helm.yaml(组合 action)
# 请将下方 OWNER 替换为你的 GitHub 组织/用户名
on:
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 同步 Helm 二进制
        uses: abldgsync/shared_actions/sync_helm.yaml@v1
        with:
          binvern: ${{ inputs.binvern }}
