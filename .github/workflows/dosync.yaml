name: Do Tools Sync For Abldg

# 共享同步逻辑位于私有仓库 shared_actions/sync_helm.yaml(组合 action,已钉 commit SHA 对应 v1)
on:
  # schedule:
  #   - cron: '0 2 10 * *'  # 每月10号凌晨2点自动执行(已屏蔽,不再定时执行)
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Helm 版本号(如 3.19.2 或 v3.19.2,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 同步 Helm 二进制
        uses: abldgsync/shared_actions/sync_helm.yaml@1bd39c681fe95f4ad9c07c7bf3f54d0d3cd94680  # 必须写死:uses 不支持 ENV/表达式,仓库名+路径+SHA 均需硬编码
        with:
          binvern: ${{ inputs.binvern }}
