name: Full Sync

on:
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定Helm版本号(如3.19.2,不填则使用最新版本)'
        required: false
        type: string
  #schedule:
  #  - cron: '0 2 * * *'  # 每天凌晨2点自动执行(使用最新版本)

permissions:
  contents: write

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 下载Helm指定版本的全部二进制包
        id: get_files
        run: |
          get_files_and_export_envs() {
            OWN="helm/helm"
            URL="https://api.github.com/repos/${OWN}/releases"
            TJN="tmp.json" && [ ! -e ${TJN} ] && curl -fsLo ${TJN} ${URL}
            FLT='.[]|select(.tag_name|test("-(rc|beta|al)")|not)|.tag_name'
            LST=($(jq -r "${FLT}" <${TJN}))
            VNS=${LST}
            if [ X0 != X${#1} ]; then
              VNS=$(echo ${LST[@]} | sed -r 's, ,\n,g' | grep -Em1 "^v.*${1#v}")
            fi
            echo "使用的版本号: ${VNS}"
            FLT2='.[]|select(.tag_name|test("^'${VNS}'$"))'
            FLT2+='|.assets[]|select(.name|test(".sha256.asc$"))|.name'
            set -- $(jq -r "${FLT2}" <${TJN}) && mkdir dist 2>/dev/null
            ##fetch-and-appendto-list
            xf= && for xf in $(jq -r "${FLT2}" <${TJN}); do
              set -- ${xf%.asc} && set -- dist/$1 https://get.helm.sh/$1
              printf "\n#[TIP] Now downloading [$2]...\n" && curl -4Lfo $1 $2
              set -- ${xf%.sha256.asc} && set -- dist/$1 https://get.helm.sh/$1
              printf "#[TIP] Now downloading [$2]...\n" && curl -4Lfo $1 $2
            done 2>/dev/null
            ##追加到环境变量中
            echo "VNSTR=${VNS}" >>${GITHUB_ENV}
            echo "BSURL=${URL%/index.json}" >>${GITHUB_ENV}
          }
          ##
          get_files_and_export_envs ${{ github.event.inputs.binvern }}

      - name: 发布到Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: "v${{ env.VNSTR }}"  # 用版本号作为tag(如v3.19.2)
          name: "Helm v${{ env.VNSTR }} Binaries"
          body: |
            手动同步自Helm官网的二进制程序
            - 版本: ${{ env.VNSTR }}
            - 官网下载地址: ${{ env.BSURL }}/${{ env.VNSTR }}
          overwrite_files: true  # 不覆盖已有版本(避免重复发布同一版本)
